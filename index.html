<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startup Mentor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;700&display=swap');
        
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }
        .noir-card {
            border: 4px solid #fff;
            box-shadow: 10px 10px 0px #ff0000;
            background: #1a1a1a;
        }
        .comic-title {
            font-family: 'Bangers', cursive;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: #fff;
            color: #000;
            padding: 5px 15px;
            display: inline-block;
            transform: rotate(-2deg);
        }
    </style>
</head>
<body class="p-8">
    <div class="max-w-2xl mx-auto">
        <div class="mb-8">
            <h1 class="comic-title text-4xl mb-4">English Startup Mentor</h1>
            <p class="text-xl italic border-l-4 border-red-600 pl-4">"The world of tech waits for no one. Let's get to work."</p>
        </div>

        <div class="noir-card p-6 mb-6">
            <h2 class="text-2xl font-bold mb-4 underline decoration-red-600">MISSION BRIEF</h2>
            <p class="mb-4 text-gray-300">Ready to build your startup? I'm here to help you master the language of tech and the art of the hustle.</p>
            <button class="bg-white text-black font-bold py-2 px-6 hover:bg-red-600 hover:text-white transition-colors duration-300">
                START LEARNING ->
            </button>
        </div>
    </div>
</body>
</html>
