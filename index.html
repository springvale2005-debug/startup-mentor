
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Test Block</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 h-screen flex flex-col items-center justify-center p-10 text-white font-sans">

    <h1 class="text-xl font-bold mb-10 text-green-400">STEP 1: MIC TEST</h1>

    <button id="micBtn" class="w-64 h-64 rounded-full bg-green-600 shadow-[0_0_30px_rgba(34,197,94,0.6)] text-white text-2xl font-black active:scale-95 transition-all">
        START VOICE
    </button>

    <p id="msg" class="mt-10 text-slate-400 italic text-center">Waiting for tap...</p>

    <script>
        const btn = document.getElementById('micBtn');
        const msg = document.getElementById('msg');

        btn.onclick = async () => {
            try {
                msg.innerText = "Requesting System Access...";
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                btn.style.backgroundColor = "#22c55e"; 
                btn.innerText = "MIC ACTIVE";
                msg.innerText = "Success! Your phone is ready for Gemini 3.1.";
            } catch (err) {
                msg.innerText = "Error: " + err.message;
                btn.style.backgroundColor = "#ef4444";
                btn.innerText = "BLOCKED";
            }
        };
    </script>
</body>
</html>
