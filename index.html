    <style>
        body { background-color: #000; color: #d8b4fe; font-family: 'Courier New', Courier, monospace; }
        .tech-noir-border { border: 2px solid #a855f7; box-shadow: 0 0 15px #a855f7; }
        .neon-text { text-shadow: 0 0 5px #22c55e; }
    </style>
</head>
<body class="p-6 min-h-screen flex flex-col items-center">

    <h1 class="text-5xl font-black italic text-purple-500 mb-2 uppercase tracking-tighter">STARTUP MENTOR</h1>
    <p class="text-xs tracking-widest text-gray-400 mb-8 uppercase">Digital Authority System v1.0</p>

    <div class="tech-noir-border bg-black p-6 w-full max-w-md rounded-none mb-6">
        <div id="status-light" class="flex items-center gap-2 mb-4">
            <div class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></div>
            <span class="text-green-500 font-bold uppercase text-sm neon-text">System Ready</span>
        </div>
        
        <p class="italic text-gray-300 mb-6 leading-relaxed">
            "In the startup world, privacy is power. Use your own key. Build your own future."
        </p>

        <button id="start-btn" class="w-full bg-green-500 text-black font-black py-4 uppercase text-xl hover:bg-green-400 transition-all flex items-center justify-center gap-2">
            START LEARNING →
        </button>
    </div>

    <div id="chat-terminal" class="hidden w-full max-w-md bg-zinc-900 p-4 border border-purple-900 mb-6 h-48 overflow-y-auto text-sm">
        <p class="text-green-400">>> Initialize interaction...</p>
    </div>

    <div class="w-full max-w-md p-4 bg-zinc-950 border border-zinc-800">
        <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-2">User API Authentication</label>
        <input type="password" id="api-key" placeholder="Enter your API key..." 
               class="w-full bg-black border border-zinc-700 p-3 text-green-400 focus:outline-none focus:border-purple-500">
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const terminal = document.getElementById('chat-terminal');

        startBtn.onclick = () => {
            const key = document.getElementById('api-key').value;
            if(!key) { alert('Please enter your API key to begin.'); return; }
            
            terminal.classList.remove('hidden');
            startBtn.innerText = "LISTENING...";
            
            // Web Speech Recognition
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'en-US';
            recognition.start();

            recognition.onresult = (event) => {
                const speechToText = event.results[0][0].transcript;
                terminal.innerHTML += `<p class="text-white mt-2">USER: ${speechToText}</p>`;
                startBtn.innerText = "START LEARNING →";
                
                // Here we would call the AI with the API key
                terminal.innerHTML += `<p class="text-purple-400 mt-1">MENTOR: I hear you. Let's build that business plan.</p>`;
            };
        };
    </script>
</body>
</html>
